version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: flyrank_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flyrank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flyrank_dev}
      POSTGRES_DB: ${POSTGRES_DB:-flyrank}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flyrank}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: flyrank_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  api:
    build: .
    container_name: flyrank_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-flyrank}:${POSTGRES_PASSWORD:-flyrank_dev}@db:5432/${POSTGRES_DB:-flyrank}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      GEO_PROVIDER_PRIMARY: ${GEO_PROVIDER_PRIMARY:-ip-api}
      GEO_PROVIDER_FALLBACK: ${GEO_PROVIDER_FALLBACK:-ipinfo}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data:
